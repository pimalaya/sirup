# ================================================================================
# `sirup` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/sirup/config.toml
#   - $HOME/.config/sirup/config.toml
#   - $HOME/.siruprc
#
# Override with `sirup -c <PATH>` or `SIRUP_CONFIG=<PATH>`. Multiple paths can be
# passed at once, separated by `:`; the first one is the base and the rest are
# deep-merged on top of it.
#
# `sirup configure` generates an account from a single email address, server URL
# or domain, and appends it here without touching what you wrote. Every field
# below is yours to edit by hand.
#
# Every path field is shell-expanded when the file is read, so `~` and `$VAR`
# work anywhere one is expected.
# ================================================================================

# Directory containing all per-account Unix sockets. Defaults to
# `$XDG_RUNTIME_DIR` (typically `/run/user/<uid>`); falls back to
# `$TMPDIR/service-sirup` when `$XDG_RUNTIME_DIR` is unset.
#socks-dir = "/run/user/1000"

# --------------------------------------------------------------------------------
# Accounts
# --------------------------------------------------------------------------------
#
# An account is a mailbox, not a session: it declares one server block per
# protocol it speaks, exactly as himalaya and the other Pimalaya tools do.
#
# `sirup start` serves every block the account declares, one socket each, so a
# single service unit covers the whole mailbox. Naming protocols narrows it:
# `sirup start imap` serves the one block, which is what a per-protocol unit
# wants. Every session is opened before any socket is bound, and the first one
# to fail ends the run.

[accounts.example]

# Use this account when a command runs without `-a`. Exactly one account should
# set it.
#default = true

# --------------------------------------------------------------------------------
# IMAP block
# --------------------------------------------------------------------------------

# Server address, a bare authority or a full URL. A bare authority takes
# `imaps://` (implicit TLS); `imap://` is cleartext with an optional STARTTLS
# upgrade. Any other scheme is rejected.
imap.server = "imap.example.com"

# Socket this protocol is served on, defaults to
# `<socks-dir>/sirup/<account>-imap.sock`.
#imap.sock-file = "/run/user/1000/sirup/example-imap.sock"

# TLS provider, defaults to the first available at runtime.
#imap.tls.provider = "rustls" | "native-tls"

# Crypto provider for rustls, defaults to the first available at runtime.
#imap.tls.rustls.crypto = "aws" | "ring"

# Custom TLS certificate (extra root, PEM-encoded).
#imap.tls.cert = "/path/to/custom/cert.pem"

# Enable STARTTLS (only valid with the cleartext `imap://` scheme).
#imap.starttls = false

# ALPN protocol identifiers offered during the TLS handshake (rustls only;
# native-tls ignores it). Omitting the field takes the protocol's own default,
# ["imap"] here. An empty array disables ALPN; any explicit value overrides.
#imap.alpn = ["imap"]
#imap.alpn = []

# Pick exactly one SASL mechanism among `anonymous`, `login`, `plain`,
# `oauthbearer`, `xoauth2`, `scram-sha-256`. Omit the whole `sasl` table to skip
# authentication.
#
# When both blocks name the same credential command, it is spawned once for the
# whole account, so a `pass` or `gpg` entry is unlocked once rather than twice.

# SASL PLAIN
# https://datatracker.ietf.org/doc/html/rfc4616
#imap.sasl.plain.authzid = "authzid"
imap.sasl.plain.username = "user@example.com"
imap.sasl.plain.password.raw = "***"
#imap.sasl.plain.password.command = "pass show example"

# SASL ANONYMOUS
# https://datatracker.ietf.org/doc/html/rfc4505
#imap.sasl.anonymous.message = "any"

# SASL LOGIN
# https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00
#imap.sasl.login.username = "user@example.com"
#imap.sasl.login.password.raw = "***"

# SASL OAUTHBEARER (host/port for the GS2 header are derived from the session
# URL at connect time).
# https://datatracker.ietf.org/doc/html/rfc7628
#imap.sasl.oauthbearer.username = "user@example.com"
#imap.sasl.oauthbearer.token.raw = "***"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]

# SASL XOAUTH2 (Google's pre-standard OAuth 2.0 SASL).
# https://developers.google.com/gmail/imap/xoauth2-protocol
#imap.sasl.xoauth2.username = "user@example.com"
#imap.sasl.xoauth2.token.raw = "***"

# SASL SCRAM-SHA-256 (requires the `scram` cargo feature).
# https://datatracker.ietf.org/doc/html/rfc7677
#imap.sasl.scram-sha-256.username = "user@example.com"
#imap.sasl.scram-sha-256.password.raw = "***"

# --------------------------------------------------------------------------------
# SMTP block
# --------------------------------------------------------------------------------
#
# Same fields as the IMAP block, with the SMTP schemes: a bare authority takes
# `smtps://` and `smtp://` is cleartext with an optional STARTTLS upgrade. Omit
# the whole block for an account serving IMAP alone.

smtp.server = "smtp.example.com"
#smtp.sock-file = "/run/user/1000/sirup/example-smtp.sock"
#smtp.starttls = false
#smtp.alpn = ["smtp"]
smtp.sasl.plain.username = "user@example.com"
smtp.sasl.plain.password.raw = "***"

# --------------------------------------------------------------------------------
# ManageSieve block
# --------------------------------------------------------------------------------
#
# Same fields again, with one difference that matters: RFC 5804 registers a
# single port (4190) and reaches TLS on it through STARTTLS, so a bare authority
# takes `sieve://` and is upgraded rather than encrypted from the first byte.
# `sieves://` is for the deployments the specification does not define, listening
# for a handshake straight away; it rides the same port.

sieve.server = "sieve.example.com"
#sieve.sock-file = "/run/user/1000/sirup/example-sieve.sock"

# Omitted, STARTTLS follows the scheme here: on for `sieve://`, off for
# `sieves://`. Setting it to false on a `sieve://` server leaves the connection
# in the clear, which is what the next option then has to allow.
#sieve.starttls = true

# Whether a SASL mechanism disclosing a reusable credential (plain, login,
# oauthbearer, xoauth2) may run over a connection still in the clear. RFC 5804
# section 5 asks for the refusal, so it is off; scram-sha-256 and anonymous
# disclose nothing and are unaffected. Only the ManageSieve session enforces it.
#sieve.allow-cleartext-auth = false

# ManageSieve registers no ALPN identifier, so none is offered unless you name
# one.
#sieve.alpn = []

sieve.sasl.plain.username = "user@example.com"
sieve.sasl.plain.password.raw = "***"
