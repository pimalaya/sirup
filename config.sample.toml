# ================================================================================
# `sirup` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/sirup/config.toml
#   - $HOME/.config/sirup/config.toml
#   - $HOME/.siruprc
#
# Override with `sirup -c <PATH>` or `SIRUP_CONFIG=<PATH>`. Multiple paths can be
# passed at once, separated by `:`; the first one is the base and the rest are
# deep-merged on top of it.
# ================================================================================

# --------------------------------------------------------------------------------
# Global config
# --------------------------------------------------------------------------------

# Directory containing all per-account Unix sockets. Defaults to
# `$XDG_RUNTIME_DIR` (typically `/run/user/<uid>`); falls back to
# `$TMPDIR/service-sirup` when `$XDG_RUNTIME_DIR` is unset.
#socks-dir = "/run/user/1000"

# --------------------------------------------------------------------------------
# Account config
# --------------------------------------------------------------------------------

# Declare one section per account. Pick one with `sirup start <NAME>` /
# `sirup repl <NAME>`. Unlike himalaya, sirup has no `default = true`: the
# account name is always required on the command line.
[accounts.example]

# Socket file for this account, defaults to
# `<socks-dir>/sirup/<account>.sock`.
#sock-file = "/run/user/1000/sirup/example.sock"

# URL connection in the form `(imap|smtp)[s]://host[:port]`. The scheme picks
# the protocol; the `s` suffix selects implicit TLS.
url = "imaps://example.com"

# TLS provider, defaults to the first available at runtime.
#tls.provider = "rustls" | "native-tls"

# Crypto provider for rustls, default to first available at runtime.
#tls.rustls.crypto = "aws" | "ring"

# Custom TLS certificate (extra root, PEM-encoded)
#tls.cert = "/path/to/custom/cert.pem"

# Enable STARTTLS (only valid when the URL scheme is the non-`s` form,
# i.e. `imap://` or `smtp://`).
#starttls = false

# --------------------------------------------------------------------------------
# SASL config
# --------------------------------------------------------------------------------

# Pick exactly one mechanism among `anonymous`, `login`, `plain`,
# `oauthbearer`, `xoauth2`, `scram-sha-256`. Omit the whole `sasl` table to
# skip authentication.

# SASL ANONYMOUS
# https://datatracker.ietf.org/doc/html/rfc4505
#sasl.anonymous.message = "any"

# SASL PLAIN
# https://datatracker.ietf.org/doc/html/rfc4616
#sasl.plain.authzid = "authzid"
sasl.plain.authcid = "test@example.com"
sasl.plain.passwd.raw = "***"
#sasl.plain.passwd.command = ["mimosa", "password", "read", "example"]

# SASL LOGIN
# https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00
#sasl.login.username = "username"
#sasl.login.password.raw = "***"
#sasl.login.password.command = ["mimosa", "password", "read", "example"]

# SASL OAUTHBEARER
# https://datatracker.ietf.org/doc/html/rfc7628
# The `host`/`port` pair is sent verbatim in the GS2 header and should match
# the server you actually connect to.
#sasl.oauthbearer.username = "user@example.com"
#sasl.oauthbearer.host = "imap.example.com"
#sasl.oauthbearer.port = 993
#sasl.oauthbearer.token.raw = "***"
#sasl.oauthbearer.token.command = ["mimosa", "token", "read", "example"]

# SASL XOAUTH2 (Google's pre-standard OAuth 2.0 SASL mechanism)
# https://developers.google.com/gmail/imap/xoauth2-protocol
#sasl.xoauth2.username = "user@example.com"
#sasl.xoauth2.token.raw = "***"
#sasl.xoauth2.token.command = ["mimosa", "token", "read", "example"]

# SASL SCRAM-SHA-256 (requires `scram` cargo feature)
# https://datatracker.ietf.org/doc/html/rfc7677
#sasl.scram-sha-256.username = "username"
#sasl.scram-sha-256.password.raw = "***"
#sasl.scram-sha-256.password.command = ["mimosa", "password", "read", "example"]
