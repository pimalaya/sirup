name: Tests

on:
  push:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit
  features:
    # Each protocol builds alone with each TLS provider, so clippy runs
    # over every feature set a packager may pick, one cache for all.
    # Builds without a TLS provider are unsupported and left out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy over every feature set
        run: |
          set -e
          sets=("" "--all-features")
          for tls in rustls-ring rustls-aws native-tls; do
            for protocol in imap smtp sieve imap,smtp,sieve; do
              sets+=("--no-default-features --features $tls,$protocol")
            done
          done
          for set in "${sets[@]}"; do
            echo "::group::clippy $set"
            read -ra flags <<< "$set"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            echo "::endgroup::"
          done
