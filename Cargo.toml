[package]
name = "sirup"
description = "CLI to spawn pre-authenticated IMAP/SMTP sessions and expose them via Unix sockets"
version = "0.1.0"
authors = ["Clément DOUIN <pimalaya.org@posteo.net>"]
edition = "2021"
license = "AGPL-3.0-only"
categories = ["command-line-utilities"]
keywords = ["cli", "imap", "session", "smtp", "auth"]
homepage = "https://pimalaya.org"
documentation = "https://github.com/pimalaya/sirup"
repository = "https://github.com/pimalaya/sirup"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["imap", "smtp", "rustls-ring"]
imap = ["dep:io-imap"]
smtp = ["dep:io-smtp"]
scram = ["io-imap?/scram", "io-smtp?/scram"]
native-tls  = ["pimalaya-stream/native-tls", "io-imap?/native-tls", "io-smtp?/native-tls"]
rustls-aws  = ["pimalaya-stream/rustls-aws", "io-imap?/rustls-aws", "io-smtp?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-imap?/rustls-ring", "io-smtp?/rustls-ring"]
vendored = ["pimalaya-stream/vendored"]

[build-dependencies]
pimalaya-cli = { version = "0.0.1", default-features = false, features = ["build"] }

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
io-imap = { version = "0.0.1", default-features = false, features = ["client"], optional = true }
io-smtp = { version = "0.0.1", default-features = false, features = ["client"], optional = true }
log = "0.4"
pimalaya-cli = { version = "0.0.1", default-features = false, features = ["terminal"] }
pimalaya-config = { version = "0.0.1", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
url = { version = "2.2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1"

[patch.crates-io]
io-imap.git = "https://github.com/pimalaya/io-imap"
io-smtp.git = "https://github.com/pimalaya/io-smtp"
pimalaya-cli.git = "https://github.com/pimalaya/cli"
pimalaya-config.git = "https://github.com/pimalaya/config"
pimalaya-stream.git = "https://github.com/pimalaya/stream"
